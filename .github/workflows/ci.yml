name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Use the venv, then create another
        run: |
          sudo podman exec circuit-python bash -lc '
            set -eux
            python3 --version
            /opt/cowsay/bin/cowsay -t hello | grep -F "hello"
            /opt/cowsay/bin/python -m pip list --format=freeze | grep -x "cowsay==6.1"
            cd "$(mktemp -d)"
            python3 -m venv v
            v/bin/python -m pip install --quiet "cowsay==6.1"
            v/bin/python -c "import cowsay; print(cowsay.get_output_string(\"cow\", \"moo\"))" | grep -F moo
          '
      - name: An environment on a path another account can change isn't run
        working-directory: examples/local
        run: |
          sudo podman exec circuit-python bash -ec '
            chown daemon /opt
            mv /opt/cowsay /srv/cowsay
            su -s /bin/sh daemon -c "ln -s /srv/cowsay /opt/cowsay"
          '
          if conn3x apply -auto-approve; then echo "apply should have refused" >&2; exit 1; fi
          sudo podman exec circuit-python bash -ec '
            rm /opt/cowsay
            mv /srv/cowsay /opt/cowsay
            chown root /opt
          '
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: An environment another account can change isn't run
        working-directory: examples/local
        run: |
          sudo podman exec circuit-python sh -ec '
            chown daemon /opt/cowsay/bin
            mv /opt/cowsay/bin/python /opt/cowsay/bin/python.real
            printf "#!/bin/sh\ntouch /root/it-ran\n" > /opt/cowsay/bin/python
            chmod +x /opt/cowsay/bin/python
          '
          if conn3x apply -auto-approve; then echo "apply should have refused" >&2; exit 1; fi
          sudo podman exec circuit-python sh -ec '[ ! -e /root/it-ran ]'
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
